name: Release

# Déclenché par un push de tag `vX.Y.Z` (ex: git tag v0.5.0 && git push origin v0.5.0).
# Build en parallèle sur 2 runners → 2 artefacts (macOS Apple Silicon,
# Windows x64), signés pour l'updater Tauri, publiés en draft.
# (macOS Intel abandonné — cf. matrice plus bas.)
# Puis un job `publish` renomme les assets en noms stables
# (Jamodio-Audio-Engine-macOS-AppleSilicon.dmg, etc.) et passe le draft en
# release publiée.
#
# Secrets requis côté repo GitHub :
#   TAURI_SIGNING_PRIVATE_KEY           — clé privée updater (tauri signer generate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — son password
#
# Secrets plus tard (signature Apple / notarisation, optionnel) :
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_ID_PASSWORD, APPLE_TEAM_ID

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Sérialise les runs d'une MÊME tag : sans ça, un re-run (ou un double
# déclenchement) lance 2 jobs `publish` en parallèle qui se battent sur l'upload
# des assets en nom stable → HTTP 422 "ReleaseAsset.name already exists" (le
# delete-then-upload de `--clobber` race). `cancel-in-progress: false` = on
# laisse finir le run en cours plutôt que de couper un build/publish à moitié.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon : runner ARM natif. macOS Intel ABANDONNÉ
          # officiellement le 2026-05-15 (cf. mémoire agent_windows_blocker.md
          # + beta_launch_strategy.md). Apple Silicon = lancé fin 2020,
          # Intel arrêté 2022 → Jamodio cible Apple Silicon + Windows.
          - runner: macos-14
            target: aarch64-apple-darwin
            # `--bundles` explicite par plateforme : sans lui, le bundler
            # construisait aussi NSIS sur Windows (~2 min perdues par build)
            # alors que seul le MSI est publié. app = requis pour le
            # .app.tar.gz de l'updater (createUpdaterArtifacts).
            bundles: app,dmg
          # ─────────────────────────────────────────────────────────────────
          # Windows : RÉACTIVÉ en v0.3.0 (2026-05-15).
          #
          # Le bloqueur ABI `srtp 0.7` (LP64 vs LLP64 sur unsigned long, repo
          # upstream HyeonuPark/srtp mort depuis 2020-12) est contourné en
          # utilisant `webrtc-srtp` (pure Rust) sur Windows uniquement, via
          # `[target.'cfg(windows)'.dependencies]` dans jamodio-audio-core.
          # macOS reste sur libsrtp2/OpenSSL inchangé. Voir mémoire
          # `srtp_strategy.md` pour le détail.
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: msi

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './ -> target'
          key: ${{ matrix.target }}
          # Sur tag push (= release), on RESTAURE la cache mais on ne SAUVE
          # PAS. Raison : le tar.exe Windows + zstd sur ~3-5 GB d'artefacts
          # cargo peut prendre 5-15 min, ce qui bloque le job `build` (et
          # donc le job `publish` qui en dépend). Les caches sont alimentées
          # par les CI sur main (où save-if reste true). Gain release : ~5-10
          # min, et plus jamais de draft bloqué sur cache save.
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # Le crate `audiopus` (dans jamodio-audio-core) lie libopus via
      # pkg-config. Chaque runner doit fournir libopus + pkg-config pour
      # l'architecture ciblée.

      # macOS : Homebrew fournit libopus + pkg-config natifs sur le runner ARM
      # (macos-14 = Apple Silicon). Pas de cross-compile.
      - name: Install libopus (macOS native)
        if: runner.os == 'macOS'
        run: brew install opus pkg-config

      # Windows : libopus via vcpkg (audiopus_sys). SRTP = pure Rust
      # (webrtc-srtp), donc plus besoin d'OpenSSL/libsrtp côté système depuis
      # v0.3.0 — voir [target.'cfg(windows)'.dependencies] dans
      # jamodio-audio-core/Cargo.toml.
      #
      # Triplet `x64-windows-static-md` = lib statique + MSVCRT dynamique
      # (compatible Tauri).
      - name: Install libopus (Windows via vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install opus:x64-windows-static-md
          "PKG_CONFIG_PATH=$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static-md\lib\pkgconfig" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBOPUS_STATIC=1" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ASIO SDK Steinberg : nécessaire pour la feature `asio` de cpal côté
      # Windows (low-latency 3-5 ms vs WASAPI shared 10-30 ms). cpal-asio-sys
      # utilise bindgen, qui requiert LLVM/clang.
      #
      # ASIO SDK est gratuit (Steinberg Inc., licence ASIO SDK 2.3.3) — URL
      # stable depuis 2019. Si Steinberg change l'URL, fallback : bundler le
      # ZIP dans le repo (autorisé pour usage privé / dev).
      - name: Install ASIO SDK + LLVM (Windows, cpal asio feature)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm -y --no-progress
          Invoke-WebRequest -Uri "https://download.steinberg.net/sdk_downloads/asiosdk_2.3.3_2019-06-14.zip" -OutFile asiosdk.zip
          # Supply-chain : on PIN le SHA256 du SDK ASIO. Sans ça, un téléchargement
          # compromis (MITM, compromission du miroir Steinberg) serait compilé dans
          # le binaire signé distribué aux beta-testeurs. Build interrompu si mismatch.
          $expected = "bc425d9b98701af74b43639798566c48bc005af7328a2251cff722c1885076b2"
          $actual = (Get-FileHash asiosdk.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) { Write-Error "ASIO SDK checksum mismatch: $actual (attendu $expected)"; exit 1 }
          Expand-Archive asiosdk.zip -DestinationPath C:\
          "CPAL_ASIO_DIR=C:\asiosdk_2.3.3_2019-06-14" | Out-File -FilePath $env:GITHUB_ENV -Append
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Le fichier .cargo/config.toml du repo pointe un PKG_CONFIG_PATH
      # relatif vers deps/opus-arm64/ (workaround local pour le dev sur Mac M*
      # avec Homebrew x86 sous Rosetta). En CI ce dossier n'existe pas et
      # l'override empêche pkg-config de trouver la lib système → on retire.
      - name: Remove local dev .cargo/config.toml override
        shell: bash
        run: rm -f .cargo/config.toml

      - name: Build + upload (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          # Requis pour créer / uploader la release via l'API GitHub.
          # Injecté automatiquement par Actions, mais doit être explicitement
          # passé à l'action sinon elle échoue avec "GITHUB_TOKEN is required".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # CMake 4.x installé sur les runners refuse de processer les
          # CMakeLists.txt avec `cmake_minimum_required(VERSION < 3.5)`.
          # L'opus vendored dans audiopus_sys 0.2.2 utilise une syntaxe
          # plus ancienne. Cette variable indique à CMake d'utiliser les
          # policies de v3.5 pour processer quand même (back-compat).
          CMAKE_POLICY_VERSION_MINIMUM: '3.5'
          # Signature Apple — à ajouter quand le certificat sera acheté
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: ./jamodio-agent
          tagName: ${{ github.ref_name }}
          releaseName: 'Jamodio Audio Engine ${{ github.ref_name }}'
          releaseBody: |
            Voir le [CHANGELOG](./CHANGELOG.md) pour les détails de cette version.

            **Téléchargements** (liens permanents, toujours la dernière version) :
            - macOS Apple Silicon (M1+) : [Jamodio-Audio-Engine-macOS-AppleSilicon.dmg](https://github.com/${{ github.repository }}/releases/latest/download/Jamodio-Audio-Engine-macOS-AppleSilicon.dmg)
            - Windows : [Jamodio-Audio-Engine-Windows.msi](https://github.com/${{ github.repository }}/releases/latest/download/Jamodio-Audio-Engine-Windows.msi)
          releaseDraft: true      # chaque matrix complète le draft
          # Tag semver de pré-release (contient un '-', ex. v0.5.0-rc.1) →
          # publié en pre-release GitHub, donc JAMAIS marqué "latest". L'updater
          # Tauri lit releases/latest/download/latest.json → les testeurs en
          # prod ne se voient PAS proposer la rc ; on installe le .msi à la main
          # depuis la page de pré-release. Tag final v0.5.0 (sans '-') = release
          # normale diffusée à tous.
          prerelease: ${{ contains(github.ref_name, '-') }}
          includeUpdaterJson: true  # génère latest.json signé (Tauri updater)
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Add stable-named copies and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          cd "$WORK"

          echo "▸ Téléchargement des artefacts du draft $TAG"
          gh release download "$TAG" -R "$REPO"
          ls -lh

          echo "▸ Duplication en noms stables (les originaux restent pour l'updater)"
          # Cibles supportées Jamodio depuis v0.4.0 :
          #   - macOS Apple Silicon (M1+)
          #   - Windows x64 MSI (NSIS retiré du bundle, plus aucun binaire NSIS produit)
          # macOS Intel + Windows NSIS legacy : abandonnés (cf. mémoires
          # agent_windows_blocker.md + beta_launch_strategy.md).
          #
          # Re-run safety : si la release porte déjà des assets en nom stable
          # (run précédent), `gh release download` les rapatrie aussi → on les
          # EXCLUT du glob, sinon `cp Jamodio-Audio-Engine-*.msi <même nom>`
          # copierait un fichier sur lui-même (`cp: same file` → abort set -e).
          for f in *.dmg *.msi; do
            [ -f "$f" ] || continue
            case "$f" in
              Jamodio-Audio-Engine-*) continue ;;   # déjà en nom stable → skip
            esac
            case "$f" in
              *aarch64*.dmg)
                cp -v "$f" 'Jamodio-Audio-Engine-macOS-AppleSilicon.dmg'
                ;;
              *.msi)
                cp -v "$f" 'Jamodio-Audio-Engine-Windows.msi'
                ;;
            esac
          done

          echo "▸ Upload des copies stables (delete-then-upload = idempotent)"
          # On supprime explicitement l'asset existant AVANT l'upload plutôt que
          # de compter sur `--clobber` : ce dernier fait delete+upload en un appel
          # et peut renvoyer 422 "already exists" si un autre run a uploadé entre
          # les deux. Le delete séparé (|| true) rend l'étape rejouable sans échec.
          for stable in \
            'Jamodio-Audio-Engine-macOS-AppleSilicon.dmg' \
            'Jamodio-Audio-Engine-Windows.msi'; do
            if [ -f "$stable" ]; then
              gh release delete-asset "$TAG" "$stable" -R "$REPO" --yes 2>/dev/null || true
              gh release upload "$TAG" "$stable" -R "$REPO"
              echo "  ✓ $stable"
            else
              echo "  ⚠ $stable introuvable, passé"
            fi
          done

          echo "▸ Publication (draft → published)"
          # Tag de pré-release (semver avec '-', ex. v0.5.0-rc.1) → on publie en
          # prerelease ET on force --latest=false : la release "latest" (donc
          # l'updater Tauri) reste sur la dernière version stable. Tag final
          # (sans '-') → release normale marquée latest.
          if [[ "$TAG" == *-* ]]; then
            echo "  ↳ pré-release détectée → --prerelease --latest=false"
            gh release edit "$TAG" -R "$REPO" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" -R "$REPO" --draft=false --latest=true
          fi

          echo "✓ Release $TAG publiée"
