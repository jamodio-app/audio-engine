<?xml version="1.0" encoding="UTF-8"?>
<!-- Jamodio Audio Engine — icône d'application (Dock macOS / app Windows).
     Source de vérité = la marque du site/app : web/app/assets/brand/favicon.svg.
     Contenu identique (3 ondes dont une fantôme + 2 POINTS EXTÉRIEURS + studio
     central) mis à l'échelle dans un squircle 1024 façon macOS. Palette marque :
     fond #111113, accent olive/jaune #e8ff3a. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Fond squircle macOS (rx ≈ 0.215 · 1024) -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="#111113"/>

  <!-- Marque dessinée dans un repère 0..100 (comme favicon.svg), recentrée sur
       le studio (50,50) puis mise à l'échelle pour remplir le squircle. -->
  <g transform="translate(512 512) scale(7.8) translate(-50 -50)">
    <g fill="none" stroke="#e8ff3a" stroke-linecap="round">
      <path d="M 10 50 Q 30 8 50 50 Q 70 92 90 50" stroke-width="1.2" opacity="0.25"/>
      <path d="M 10 50 Q 30 22 50 50 Q 70 78 90 50" stroke-width="2.5" opacity="0.55"/>
      <path d="M 10 50 Q 30 36 50 50 Q 70 64 90 50" stroke-width="4.5"/>
    </g>

    <!-- Points extérieurs (extrémités des ondes) — l'élément demandé : présents
         sur la marque site/app, désormais sur l'icône Dock. -->
    <circle cx="10" cy="50" r="7" fill="#111113" stroke="#e8ff3a" stroke-width="1.5"/>
    <circle cx="10" cy="50" r="3.5" fill="#e8ff3a" opacity="0.7"/>
    <circle cx="90" cy="50" r="7" fill="#111113" stroke="#e8ff3a" stroke-width="1.5"/>
    <circle cx="90" cy="50" r="3.5" fill="#e8ff3a" opacity="0.7"/>

    <!-- Studio central -->
    <circle cx="50" cy="50" r="15" fill="#111113" stroke="#e8ff3a" stroke-width="3"/>
    <circle cx="50" cy="50" r="9" fill="#e8ff3a"/>
    <circle cx="50" cy="50" r="4" fill="#111113"/>
  </g>
</svg>
