<?xml version="1.0" encoding="UTF-8"?>
<!-- WiX MSI dialog sidebar — 493×312, shown on Welcome + Exit screens -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 493 312" width="493" height="312">
  <rect width="493" height="312" fill="#0e0f11"/>
  <!-- subtle gradient overlay -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d22" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0e0f11" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="493" height="312" fill="url(#g)"/>
  <!-- centered V5 waveform icon, ~160px -->
  <g transform="translate(176 76)">
    <g fill="none" stroke="#e8ff3a" stroke-linecap="round" transform="translate(70 70) scale(1.35) translate(-50 -50)">
      <path d="M 10 50 Q 30 22 50 50 Q 70 78 90 50" stroke-width="2.5" opacity="0.5"/>
      <path d="M 10 50 Q 30 36 50 50 Q 70 64 90 50" stroke-width="5"/>
    </g>
    <g transform="translate(70 70)">
      <circle r="20" fill="#0e0f11" stroke="#e8ff3a" stroke-width="3"/>
      <circle r="12" fill="#e8ff3a"/>
      <circle r="5" fill="#0e0f11"/>
    </g>
  </g>
  <!-- product name + tagline -->
  <text x="246" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="middle">JAMODIO</text>
  <text x="246" y="280" font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="400" fill="#9ca3af" text-anchor="middle">Audio Engine</text>
</svg>
