[package]
name = "jamodio-agent"
version = "0.2.4"
edition = "2021"
description = "Jamodio Desktop Audio Agent — low-latency ASIO/CoreAudio bridge"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jamodio-audio-core = { path = "../jamodio-audio-core" }
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
thread-priority = "0.10"

# Logging structuré (PROD-grade) — voir convention dans CLAUDE.md.
# tracing : façade compatible avec spans + structured fields.
# tracing-subscriber : formatters (compact stderr + JSON file).
# tracing-appender : rotation journalière de fichier non-bloquante.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
tracing-appender = "0.2"

# Pour ouvrir le dossier de logs depuis le bouton "Export" de l'UI agent.
opener = "0.7"

# Tauri v2
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
# Empêche un 2e process agent de démarrer (fix double-launch macOS/Windows).
# Doit être enregistré AVANT deep-link cf. doc Tauri.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Auto-update via GitHub releases (config endpoint dans tauri.conf.json).
# Sans ce plugin, le bloc `updater` de tauri.conf.json est inerte → les
# users ne sont jamais notifiés (cf. mémoire agent_release_checklist).
tauri-plugin-updater = "2"

# ASIO support on Windows
[target.'cfg(windows)'.dependencies]
cpal = { version = "0.15", features = ["asio"] }
