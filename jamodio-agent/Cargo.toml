# HÃ´te AU plugins â€” macOS uniquement.
[target.'cfg(target_os = "macos")'.dependencies]
jamodio-au-host = { path = "../jamodio-au-host" }
# Sprint S2 â€” bindings Mach (thread_policy_set, mach_timebase_info) pour le
# fallback QoS+time-constraint quand os_workgroup_join Ã©choue. Cf. rt_priority.rs.
mach2 = "0.4"
