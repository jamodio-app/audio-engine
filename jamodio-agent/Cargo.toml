[package]
name = "jamodio-agent"
version = "0.6.0"
edition = "2021"
license = "LicenseRef-Jamodio-Proprietary"
publish = false
description = "Jamodio Desktop Audio Agent — low-latency ASIO/CoreAudio bridge"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jamodio-audio-core = { path = "../jamodio-audio-core" }
cpal = "0.15"
# Rééchantillonnage du canal VOIX uniquement (micro-casque en 44,1/16 kHz).
# Le chemin INSTRUMENT reste en 48 kHz natif obligatoire (garde R2) — aucun
# resampler n'y est autorisé. Déjà présent dans l'arbre via DeepFilterNet.
rubato = "0.14"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
# socket2 : bind du serveur WS avec SO_REUSEADDR (tokio ne le pose pas sur
# Windows) → permet de re-binder le port 9876 immédiatement après un
# redémarrage de l'agent, malgré la connexion précédente encore en TIME_WAIT.
socket2 = "0.5"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
thread-priority = "0.10"
base64 = "0.22"            # Encode des fichiers Ogg/Opus du record pour le wire WS (REC-3)
midir = "0.10"             # Discovery + ouverture des MIDI devices (S2 INSERT plugins instruments)

# Logging structuré (PROD-grade) — voir convention dans CLAUDE.md.
# tracing : façade compatible avec spans + structured fields.
# tracing-subscriber : formatters (compact stderr + JSON file).
# tracing-appender : rotation journalière de fichier non-bloquante.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "time"] }
tracing-appender = "0.2"

# Pour ouvrir le dossier de logs depuis le bouton "Export" de l'UI agent.
opener = "0.7"

# Tauri v2
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
# Empêche un 2e process agent de démarrer (fix double-launch macOS/Windows).
# Doit être enregistré AVANT deep-link cf. doc Tauri.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Auto-update via GitHub releases (config endpoint dans tauri.conf.json).
# Sans ce plugin, le bloc `updater` de tauri.conf.json est inerte → les
# users ne sont jamais notifiés (cf. mémoire agent_release_checklist).
tauri-plugin-updater = "2"

# ASIO support on Windows
[target.'cfg(windows)'.dependencies]
cpal = { version = "0.15", features = ["asio"] }
# Accès DIRECT à l'API ASIO bas-niveau que cpal n'expose pas : enregistrement
# du callback de message ASIO (`Driver::add_message_callback`) pour honorer
# `kAsioResetRequest`. cpal 0.15 ne pose AUCUN message callback → quand le
# driver demande un reset, asio-sys lui répond « 1 » (host gère) mais n'exécute
# rien → le driver halte ses callbacks silencieusement (wedge). On rétablit le
# handshake en se branchant sur le même registre global via le `Driver` que cpal
# possède déjà (cf. audio/asio_reset.rs). Version PINNÉE sur celle de cpal 0.15.3
# (= asio-sys 0.2.x) pour partager exactement le même crate (registre/types).
asio-sys = "0.2"
# Hôte VST3 plugins — Windows uniquement (parité fonctionnelle avec AU sur macOS).
jamodio-vst3-host = { path = "../jamodio-vst3-host" }
# Sprint S2 — MMCSS "Pro Audio" pour la priorité RT du thread encoder
# (AvSetMmThreadCharacteristicsW dans avrt.dll). Cf. rt_priority.rs.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    # 0.5.9-2 — Job Object KILL_ON_JOB_CLOSE : lie le worker de scan
    # out-of-process à l'agent → l'OS tue le worker si l'agent meurt, même
    # sur kill -9. Cf. plugin_scan/coordinator.rs::job. `Win32_Security` est
    # requis car la signature de CreateJobObjectW référence SECURITY_ATTRIBUTES.
    "Win32_System_JobObjects",
    "Win32_Security",
    # Énumération ASIO : `asio-sys` charge les drivers via CoCreateInstance sans
    # initialiser COM lui-même → l'énumération doit tourner sur un thread STA.
    # Cf. device.rs::enumerate_with_com.
    "Win32_System_Com",
    # 0.5.4-19 — PowerRegisterSuspendResumeNotification (réveil de veille → re-init
    # ASIO). Cf. audio/power_events.rs. Les constantes PBT_*/DEVICE_NOTIFY_CALLBACK
    # vivent dans Win32_UI_WindowsAndMessaging.
    "Win32_System_Power",
    # PowerSettingRegisterNotification(GUID_CONSOLE_DISPLAY_STATE) : la VEILLE
    # MODERNE (S0ix) ne délivre AUCUN PBT_APMRESUME* — seul l'état de l'écran
    # signale ces transitions. Le GUID vit dans SystemServices.
    "Win32_System_SystemServices",
    "Win32_UI_WindowsAndMessaging",
] }
# Chantier quit UX — promotion de l'icone tray Win11 (IsPromoted=1 dans
# HKCU\Control Panel\NotifyIconSettings). Cf. tray_promote.rs.
winreg = "0.52"

# Hôte AU plugins — macOS uniquement.
[target.'cfg(target_os = "macos")'.dependencies]
jamodio-au-host = { path = "../jamodio-au-host" }
# Sprint S2 — bindings Mach (thread_policy_set, mach_timebase_info) pour le
# fallback QoS+time-constraint quand os_workgroup_join échoue. Cf. rt_priority.rs.
mach2 = "0.4"
libc = "0.2"
# 0.5.11-10 — un seul appel Objective-C : `[NSApp disableRelaunchOnLogin]` au
# démarrage. macOS « rouvre les apps à la reconnexion » relance toute app
# Regular qui tournait au reboot, indépendamment du LaunchAgent → l'autostart
# décoché n'était pas respecté sur Mac. On opte-out de cette restauration pour
# que le LaunchAgent (= notre toggle) soit l'UNIQUE mécanisme de démarrage.
objc2 = "0.6"
