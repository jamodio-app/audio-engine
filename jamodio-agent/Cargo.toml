[package]
name = "jamodio-agent"
version = "0.5.4-17"
edition = "2021"
license = "LicenseRef-Jamodio-Proprietary"
publish = false
description = "Jamodio Desktop Audio Agent â€” low-latency ASIO/CoreAudio bridge"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jamodio-audio-core = { path = "../jamodio-audio-core" }
cpal = "0.15"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
# socket2 : bind du serveur WS avec SO_REUSEADDR (tokio ne le pose pas sur
# Windows) â†’ permet de re-binder le port 9876 immÃ©diatement aprÃ¨s un
# redÃ©marrage de l'agent, malgrÃ© la connexion prÃ©cÃ©dente encore en TIME_WAIT.
socket2 = "0.5"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
parking_lot = "0.12"
thread-priority = "0.10"
base64 = "0.22"            # Encode des fichiers Ogg/Opus du record pour le wire WS (REC-3)
midir = "0.10"             # Discovery + ouverture des MIDI devices (S2 INSERT plugins instruments)
rubato = "0.16"            # Resampler haute qualitÃ© (mic onboard Windows 44.1 â†’ 48 kHz Opus)

# Logging structurÃ© (PROD-grade) â€” voir convention dans CLAUDE.md.
# tracing : faÃ§ade compatible avec spans + structured fields.
# tracing-subscriber : formatters (compact stderr + JSON file).
# tracing-appender : rotation journaliÃ¨re de fichier non-bloquante.
tracing = "0.1"
