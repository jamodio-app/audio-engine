# Sans ce plugin, le bloc `updater` de tauri.conf.json est inerte â†’ les
# users ne sont jamais notifiÃ©s (cf. mÃ©moire agent_release_checklist).
tauri-plugin-updater = "2"

# ASIO support on Windows
[target.'cfg(windows)'.dependencies]
cpal = { version = "0.15", features = ["asio"] }
# AccÃ¨s DIRECT Ã  l'API ASIO bas-niveau que cpal n'expose pas : enregistrement
# du callback de message ASIO (`Driver::add_message_callback`) pour honorer
# `kAsioResetRequest`. cpal 0.15 ne pose AUCUN message callback â†’ quand le
# driver demande un reset, asio-sys lui rÃ©pond Â« 1 Â» (host gÃ¨re) mais n'exÃ©cute
# rien â†’ le driver halte ses callbacks silencieusement (wedge). On rÃ©tablit le
# handshake en se branchant sur le mÃªme registre global via le `Driver` que cpal
# possÃ¨de dÃ©jÃ  (cf. audio/asio_reset.rs). Version PINNÃ‰E sur celle de cpal 0.15.3
# (= asio-sys 0.2.x) pour partager exactement le mÃªme crate (registre/types).
asio-sys = "0.2"
# HÃ´te VST3 plugins â€” Windows uniquement (paritÃ© fonctionnelle avec AU sur macOS).
jamodio-vst3-host = { path = "../jamodio-vst3-host" }
# Sprint S2 â€” MMCSS "Pro Audio" pour la prioritÃ© RT du thread encoder
# (AvSetMmThreadCharacteristicsW dans avrt.dll). Cf. rt_priority.rs.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    # Ã‰numÃ©ration ASIO : `asio-sys` charge les drivers via CoCreateInstance sans
    # initialiser COM lui-mÃªme â†’ l'Ã©numÃ©ration doit tourner sur un thread STA.
    # Cf. device.rs::enumerate_with_com.
    "Win32_System_Com",
] }
# Chantier quit UX â€” promotion de l'icone tray Win11 (IsPromoted=1 dans
# HKCU\Control Panel\NotifyIconSettings). Cf. tray_promote.rs.
