<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Licences — Jamodio Audio Engine</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Fenêtre DÉDIÉE : contrairement à la fenêtre principale (300×380, non
       redimensionnable), celle-ci est faite pour lire — elle défile et s'agrandit.
       La liste des composants tiers grandira avec le produit (plugins d'effets
       open-source à venir). */
    body { margin: 0; }
    .lic-wrap { display: flex; flex-direction: column; height: 100vh; }
    .lic-head {
      display: flex; align-items: baseline; gap: 8px;
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .lic-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--accent);
    }
    .lic-sub { font-size: 10px; color: var(--muted); }
    .lic-body { flex: 1; overflow: auto; padding: 14px 16px 20px; }
    .lic-body pre {
      margin: 0;
      font-family: ui-monospace, 'JetBrains Mono', monospace;
      font-size: 11px; line-height: 1.6; color: var(--text2, #c9cdd4);
      white-space: pre-wrap; word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="lic-wrap">
    <div class="lic-head">
      <span class="lic-title">Licences des composants tiers</span>
      <span class="lic-sub">open-source embarqué dans l'Audio Engine</span>
    </div>
    <div class="lic-body"><pre id="lic-text">Chargement…</pre></div>
  </div>
  <script>
    // Le texte vient du binaire (include_str! de THIRD-PARTY-LICENSES.md) : ce
    // qui s'affiche est exactement ce qui est livré. textContent, jamais innerHTML.
    (async () => {
      const el = document.getElementById('lic-text');
      // Le pont Tauri peut n'être pas encore injecté au tout premier rendu de la
      // fenêtre : on réessaie brièvement plutôt que de laisser un écran vide
      // sans explication (une fenêtre muette ressemble à un plantage).
      for (let i = 0; i < 40; i++) {
        const invoke = window.__TAURI__?.core?.invoke;
        if (invoke) {
          try {
            el.textContent = await invoke('get_third_party_licenses');
          } catch (err) {
            el.textContent = 'Impossible de lire les licences : ' + String(err);
          }
          return;
        }
        await new Promise((r) => setTimeout(r, 50));
      }
      el.textContent = 'Licences indisponibles : le pont Tauri n\'a pas répondu.';
    })();
  </script>
</body>
</html>
