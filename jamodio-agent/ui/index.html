<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Jamodio Audio Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-label="Jamodio">
          <g fill="none" stroke="#e8ff3a" stroke-linecap="round">
            <path d="M 10 50 Q 30 22 50 50 Q 70 78 90 50" stroke-width="2.5" opacity="0.5"/>
            <path d="M 10 50 Q 30 36 50 50 Q 70 64 90 50" stroke-width="5"/>
          </g>
          <circle cx="50" cy="50" r="15" fill="#0e0f11" stroke="#e8ff3a" stroke-width="3"/>
          <circle cx="50" cy="50" r="9" fill="#e8ff3a"/>
          <circle cx="50" cy="50" r="4" fill="#0e0f11"/>
        </svg>
        <span class="brand-wordmark"><span class="w-jam">jam</span><span class="w-o">o</span><span class="w-dio">dio</span></span>
      </div>
      <div class="badge" id="status">IDLE</div>
    </div>
    <div class="tagline">YOUR STUDIO. <span class="tagline-accent">ANYWHERE.</span></div>
    <div class="tagline tagline-jam">MUSIC CREATES <span class="tagline-accent">CONNECTIONS.</span></div>
    <div class="info">
      <div class="row" title="Interface audio qui capte ton instrument. La ligne Talkback juste en dessous indique, elle, le micro utilisé pour parler aux autres.">
        <span class="label">Instrument</span>
        <span class="value" id="device">—</span>
      </div>
      <div class="row" title="Micro utilisé pour parler aux autres musiciens (talkback). Un nom suivi d'un numéro de canal = la voix est prise sur une entrée de ton interface instrument ; un nom seul = un micro à part, ouvert par l'agent.">
        <span class="label">Talkback</span>
        <span class="value" id="voice-device">—</span>
      </div>
      <div class="row" title="Latence audio LOCALE de l'agent : ta carte → encodage → décodage → buffer de gigue → ta carte. N'inclut PAS le réseau. La latence réelle avec un partenaire (réseau compris) s'affiche dans le studio, sur ta tranche.">
        <span class="label">Latence locale</span>
        <span class="value" id="latency">—</span>
      </div>
      <div class="row" title="Marge ajoutée pour absorber l'irrégularité d'arrivée des paquets des autres musiciens. Ce n'est PAS la gigue mesurée du réseau, c'est la marge que l'agent lui oppose — elle s'adapte à la qualité du lien. « — » quand tu es seul.">
        <span class="label">Marge anti-gigue</span>
        <span class="value" id="jitter">—</span>
      </div>
      <div class="row" title="Taille du buffer matériel de ta carte son (CPAL). Plus c'est petit, plus la latence locale est faible.">
        <span class="label">Buffer carte</span>
        <span class="value" id="buffer">—</span>
      </div>
      <div class="row" title="Nombre de musiciens dont tu reçois l'audio. 0 = tu es seul dans le studio.">
        <span class="label">Musiciens reçus</span>
        <span class="value" id="streams">0</span>
      </div>
      <div class="row" title="Coupures dans l'audio reçu des autres musiciens (paquets arrivés trop tard), comptées depuis le début de la session en cours. Doit rester proche de 0.">
        <span class="label">Coupures</span>
        <span class="value" id="underruns">0</span>
      </div>
      <!-- Sans cette phrase, une fenêtre pleine de « — » se lit comme une panne
           alors que l'agent attend simplement une session. -->
      <div class="info-hint" id="info-hint">Les mesures apparaissent quand tu entres dans un studio.</div>
    </div>
    <div class="settings">
      <label class="row setting" for="autostart-toggle" title="Lance automatiquement l'Audio Engine à l'ouverture de session de votre ordinateur. Décochez pour ne le démarrer que manuellement (ou depuis jamodio.com).">
        <span class="label">Démarrer avec l'ordinateur</span>
        <!-- Interrupteur au style de l'app web : la case à cocher native reste
             (accessibilité + clavier + le JS lit toujours `.checked`), c'est le
             <span> frère qui porte l'apparence. -->
        <input type="checkbox" id="autostart-toggle" class="toggle-input">
        <span class="switch" aria-hidden="true"></span>
      </label>
    </div>
    <div class="actions">
      <button id="export-logs" type="button">Exporter les logs</button>
      <!-- Obligation d'attribution MIT / Apache-2.0 des composants du Filtre
           antibruit : le texte doit être fourni AVEC le logiciel. -->
      <button id="show-licenses" type="button" title="Licences des composants open-source embarqués (Filtre antibruit)">Licences</button>
      <!-- Filet quit OS-agnostic : indispensable sur Windows quand l'icône
           tray est rangée dans l'overflow (cf. tray_promote.rs). -->
      <button id="quit-app" type="button" title="Ferme l'Audio Engine (les studios ouverts seront prévenus)">Quitter l'agent</button>
    </div>
    <div class="ws-status" id="ws-status">ws://localhost:9876 — en attente</div>
    <div class="version" id="version">—</div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let ws = null;
    let statsInterval = null;

    // Tauri 2 expose le pont JS sur window.__TAURI__ uniquement si
    // `withGlobalTauri: true` dans tauri.conf.json (ce qu'on a activé).
    // Helper qui résout invoke pour rester safe en preview navigateur (où
    // __TAURI__ n'existe pas) — dans ce cas le fallback retourne null.
    function tauriInvoke(cmd, args) {
      const invoke = window.__TAURI__?.core?.invoke;
      if (!invoke) return Promise.resolve(null);
      return invoke(cmd, args);
    }

    // ─── Version dynamique ────────────────────────────────────
    // Lit CARGO_PKG_VERSION via une commande Tauri pour éviter de
    // hardcoder la version dans l'HTML (et risquer un mismatch Cargo
    // vs UI à chaque release).
    tauriInvoke('get_version').then(v => {
      if (v) $('version').textContent = 'v' + v;
    }).catch(() => {});

    // ─── Bouton "Exporter les logs" ────────────────────────────
    // Ouvre le dossier de logs OS-spécifique (Finder / Explorer / Files).
    // Le user copie le dernier fichier agent.log.YYYY-MM-DD pour l'envoyer.
    const exportBtn = $('export-logs');
    if (exportBtn) {
      exportBtn.addEventListener('click', async () => {
        try {
          const invoke = window.__TAURI__?.core?.invoke;
          if (!invoke) {
            exportBtn.textContent = 'Tauri indisponible';
            return;
          }
          const path = await invoke('open_log_dir');
          exportBtn.textContent = '✓ Dossier ouvert';
          exportBtn.classList.add('ok');
          exportBtn.title = path;
          setTimeout(() => {
            exportBtn.textContent = 'Exporter les logs';
            exportBtn.classList.remove('ok');
          }, 2500);
        } catch (err) {
          exportBtn.textContent = '✗ Échec';
          exportBtn.title = String(err);
          setTimeout(() => { exportBtn.textContent = 'Exporter les logs'; }, 2500);
        }
      });
    }

    // ─── Bouton "Licences" ─────────────────────────────────────
    // Écrit le texte embarqué dans un fichier et laisse l'OS l'ouvrir. Une
    // seconde webview figeait l'agent sur Windows (cf. open_licenses côté Rust) ;
    // le lecteur de texte du système, lui, défile et se ferme toujours.
    const licBtn = $('show-licenses');
    if (licBtn) {
      licBtn.addEventListener('click', async () => {
        try {
          const path = await tauriInvoke('open_licenses');
          licBtn.textContent = '✓ Ouvert';
          licBtn.title = path || '';
          setTimeout(() => { licBtn.textContent = 'Licences'; }, 2500);
        } catch (err) {
          licBtn.textContent = '✗ Échec';
          licBtn.title = String(err);
          setTimeout(() => { licBtn.textContent = 'Licences'; }, 2500);
        }
      });
    }

    // ─── Bouton "Quitter l'agent" ──────────────────────────────
    // Sortie propre : la commande quit_app broadcast Shutdown aux browsers
    // connectés avant de terminer le process (même chemin que le menu tray).
    const quitBtn = $('quit-app');
    if (quitBtn) {
      quitBtn.addEventListener('click', () => {
        quitBtn.textContent = 'Fermeture…';
        quitBtn.disabled = true;
        tauriInvoke('quit_app');
      });
    }

    // ─── Toggle "Démarrer avec l'ordinateur" ───────────────────
    // Reflète l'état OS réel au boot (get_autostart) puis pilote l'autostart
    // sur changement. On relit l'état effectif renvoyé par set_autostart pour
    // ne jamais afficher un faux "activé" ; en cas d'échec, on revert la case.
    const autostartToggle = $('autostart-toggle');
    if (autostartToggle) {
      tauriInvoke('get_autostart').then(v => {
        if (v !== null) autostartToggle.checked = !!v;
      }).catch(() => {});
      autostartToggle.addEventListener('change', async () => {
        const want = autostartToggle.checked;
        autostartToggle.disabled = true;
        try {
          const now = await tauriInvoke('set_autostart', { enabled: want });
          if (now !== null) autostartToggle.checked = !!now;
        } catch {
          autostartToggle.checked = !want;  // échec → on ne ment pas sur l'état
        } finally {
          autostartToggle.disabled = false;
        }
      });
    }

    function connect() {
      try {
        ws = new WebSocket('ws://localhost:9876');
      } catch { setTimeout(connect, 3000); return; }

      ws.onopen = () => {
        $('ws-status').textContent = 'ws://localhost:9876 — connecté';
        $('ws-status').classList.add('ok');
        ws.send(JSON.stringify({ type: 'get-stats' }));
        statsInterval = setInterval(() => {
          if (ws && ws.readyState === 1) {
            ws.send(JSON.stringify({ type: 'get-stats' }));
          }
        }, 2000);
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        switch (msg.type) {
          case 'status': {
            const active = msg.state === 'capturing';
            $('status').textContent = active ? 'ACTIF' : 'IDLE';
            $('status').classList.toggle('active', active);
            $('info-hint').style.display = active ? 'none' : '';
            if (!active) {
              $('buffer').textContent = '—';
              $('latency').textContent = '—';
              $('jitter').textContent = '—';
              $('streams').textContent = '0';
              $('underruns').textContent = '0';
            }
            break;
          }

          case 'devices':
            if (msg.inputs && msg.inputs.length > 0) {
              const def = msg.inputs.find(d => d.isDefault) || msg.inputs[0];
              $('device').textContent = def.name;
              $('device').title = def.name;
            }
            break;

          case 'stats': {
            // Device name
            // Plus de troncature en JS : la coupure se fait en CSS, au pixel et
            // seulement si nécessaire (cf. `.value` dans style.css). Le texte
            // complet reste dans l'infobulle.
            if (msg.device) {
              $('device').textContent = msg.device;
              $('device').title = msg.device;
            }
            // `musicians` = flux INSTRUMENT (un partenaire qui parle envoie deux
            // flux) ; repli sur `streams` pour un agent antérieur.
            $('streams').textContent = (msg.musicians ?? msg.streams) || 0;
            $('voice-device').textContent = msg.voiceDevice || '—';
            $('voice-device').title = msg.voiceDevice || '';
            $('underruns').textContent = msg.underruns || 0;
            // Stats latence : on utilise les valeurs pré-calculées par l'agent
            // (totalLatencyMs / jitterTargetMs / bufferMs) — sans recombinaison
            // côté UI (les champs capture/playback exposés séparément contiennent
            // déjà bufferMs, ne pas les additionner ici).
            // Buffer carte : on n'affiche que la valeur RÉELLEMENT mesurée
            // (`inputBufferMs`). Absente = le pilote a choisi sa taille sans
            // l'exposer → on le dit, plutôt que d'afficher l'estimation de repli
            // que porte `bufferMs`, qui serait un chiffre inventé.
            const bufMs = msg.inputBufferMs;
            const totalMs = msg.totalLatencyMs || 0;
            const jitterMs = msg.jitterTargetMs || 0;
            if (totalMs > 0) {
              $('latency').textContent = totalMs.toFixed(1) + 'ms';
              $('buffer').textContent = (typeof bufMs === 'number')
                ? bufMs.toFixed(1) + 'ms'
                : 'auto';
              $('jitter').textContent = jitterMs > 0 ? jitterMs.toFixed(1) + 'ms' : '—';
            } else {
              $('latency').textContent = '—';
              $('buffer').textContent = '—';
              $('jitter').textContent = '—';
              $('voice-device').textContent = '—';
            }
            break;
          }
        }
      };

      ws.onclose = () => {
        clearInterval(statsInterval);
        $('ws-status').textContent = 'ws://localhost:9876 — déconnecté';
        $('ws-status').classList.remove('ok');
        $('status').textContent = 'IDLE';
        $('status').classList.remove('active');
        $('device').textContent = '—';
        $('buffer').textContent = '—';
        $('latency').textContent = '—';
        $('streams').textContent = '0';
        setTimeout(connect, 3000);
      };

      ws.onerror = () => { try { ws.close(); } catch {} };
    }

    connect();
  </script>
</body>
</html>
