[package]
name = "jamodio-audio-core"
version = "0.6.5-23"
edition = "2021"
license = "LicenseRef-Jamodio-Proprietary"
publish = false
description = "Jamodio audio engine core — Opus codec, RTP, UDP, mixer, jitter buffer"

[dependencies]
audiopus = "0.3.0-rc.0"    # Opus encode/decode (safe wrapper around libopus)
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros", "sync", "time"] }
crossbeam-channel = "0.5"  # Lock-free channels (audio thread ↔ network thread)
ringbuf = "0.5"            # SPSC lock-free ring buffer (jitter management)
parking_lot = "0.12"       # Verrous fins du mixer (RwLock map + Mutex par flux) — C2.1
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"            # Setsockopt IP_TOS pour DSCP EF marking
base64 = "0.22"            # Encode/decode des clés SRTP (mediasoup wire format)
getrandom = "0.2"          # Génération de clés SRTP cryptographiquement sûres
zeroize = "1"              # Efface les clés SRTP décodées de la mémoire au drop
tracing = "0.1"            # Logging structuré (façade) — init côté binaire jamodio-agent
thiserror = "1"            # Dérive Error proprement (utilisé par plugin_host)

# ── Isolation de voix talkback (Lot 2) — 100 % pur Rust via tract, ZÉRO dép native ML.
# DeepFilterNet : le crate publié (0.2.5) est périmé (sans inférence) → dépendance GIT
# épinglée à un REV FIXE (jamais HEAD). Le crate demande tract ^0.21.4 mais tract a cassé
# son API dans un patch 0.21.x (`symbol_table`) → PIN STRICT =0.21.4 des sous-crates tract.
# (Durcissement prod possible : vendoring du crate — cf. PLAN-LOT2 §3.1.)
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d", features = ["tract"] }
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"     # aussi utilisé pour le VAD Silero (variante ifless)
tract-hir = "=0.21.4"
tract-pulse = "=0.21.4"
ndarray = "=0.15.6"        # version attendue par deep_filter

# SRTP — chiffrement+auth du flux RTP agent ↔ SFU (AEAD AES-256-GCM).
# Stratégie par plateforme :
#
#   macOS / Linux : libsrtp2 + OpenSSL VENDORÉS (compilés depuis sources).
#                   → binaire 100 % autonome, aucune dep système chez l'utilisateur.
#                   Coût : 1er build long (~5 min pour OpenSSL), ensuite caché.
#                   Wrapper : net/srtp_libsrtp.rs (cfg(not(windows))).
#
#   Windows       : webrtc-srtp (pure Rust, écosystème pion/webrtc-rs).
#                   → 0 dep système (vire vcpkg+OpenSSL+libsrtp du CI).
#                   Le crate `srtp 0.7` (libsrtp2 wrapper) a un bug ABI
#                   irréparable en amont sur MSVC (LLP64 vs LP64), repo
#                   upstream HyeonuPark/srtp mort depuis 2020-12.
#                   Wrapper : net/srtp_webrtc.rs (cfg(windows)).
#
# Les deux wrappers exposent EXACTEMENT la même API publique (SrtpParameters,
# SrtpContext::new/protect/unprotect, SrtcpContext::new/protect_rtcp/unprotect_rtcp)
# → udp.rs et uplink.rs ne voient aucune différence.
[target.'cfg(not(windows))'.dependencies]
srtp = { version = "0.7", default-features = false, features = ["bytes", "log", "build-libsrtp", "build-openssl"] }

[target.'cfg(windows)'.dependencies]
webrtc-srtp = "0.17"
bytes = "1"
# N13 (chantier tampon) — SIO_UDP_CONNRESET sur la socket de réception RTP.
# Winsock remonte WSAECONNRESET (10054) sur un `recv` UDP quand un ICMP « port
# unreachable » revient d'un ENVOI précédent : la socket reste parfaitement
# valable, mais notre boucle traite ça comme une erreur. Constaté en vrai le
# 18/09/2026 (21 occurrences en une session sur le PC de recette). Cf. net/udp.rs.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    # La signature de WSAIoctl référence OVERLAPPED (passé nul : ioctl synchrone).
    "Win32_System_IO",
] }

[dev-dependencies]
hound = "3"                # lecture/écriture WAV pour l'exemple de diagnostic iso_offline
