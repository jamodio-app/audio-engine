[workspace]
resolver = "2"
members = [
  "jamodio-audio-core",
  "jamodio-agent",
  "jamodio-au-host",
  "jamodio-vst3-host",
]
# La copie patchée d'`asio-sys` (cf. `[patch.crates-io]` en fin de fichier) vit
# dans l'arborescence mais n'est PAS un membre : elle n'est ni testée ni lintée
# comme notre code, et `cargo test --workspace` ne doit pas la traverser.
exclude = ["vendor/asio-sys"]

# ── Isolation de voix (Lot 2) : les crates `tract` exécutent des passes de
# génération de code coûteuses qui PANIQUENT sous le profil dev (opt-level 0 +
# debug-assertions + overflow-checks) — tract réemballe ça en `Err("running pass
# codegen")` au chargement du modèle. On compile donc UNIQUEMENT ces dépendances
# comme en release (opt + sans checks) ; NOTRE code reste en debug rapide à itérer.
# (Uniquement des dépendances tierces — n'affecte pas la sémantique de notre code.)
[profile.dev.package.tract-core]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-data]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-linalg]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-nnef]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-hir]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-onnx]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-onnx-opl]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-pulse]
opt-level = 3
debug-assertions = false
overflow-checks = false
[profile.dev.package.tract-pulse-opl]
opt-level = 3
debug-assertions = false
overflow-checks = false

# ── Copie patchée d'`asio-sys` (Windows) ────────────────────────────────────
# Un pilote ASIO a plusieurs façons de dire qu'il va mal ; le crate publié n'en
# transmet qu'UNE (`kAsioResetRequest`) et jette les autres, dont
# `kAsioResyncRequest` — « j'ai perdu des données ». Après deux épisodes de son
# dégradé sur un Focusrite (18/09/2026), il était impossible de savoir APRÈS COUP
# si le pilote avait signalé quoi que ce soit : par construction, pas par manque
# de chance. La copie locale transmet ces messages ; elle ne change AUCUNE réponse
# rendue au pilote. Diff complet et raisons : en-tête de
# `vendor/asio-sys/src/bindings/mod.rs` (14 lignes retirées à l'amont).
#
# Redirection par CHEMIN (pas de dépôt git de plus) : elle s'applique à tout le
# graphe, donc cpal utilise la même copie — c'est exactement ce qu'on veut, ses
# callbacks ASIO et les nôtres partagent le même registre.
[patch.crates-io]
asio-sys = { path = "vendor/asio-sys" }
